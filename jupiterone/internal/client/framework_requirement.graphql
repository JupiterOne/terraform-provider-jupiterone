query GetFrameworkById($id: ID!) {
  controlFramework(id: $id) {
    id
    name
    description
    resourceGroupId
    owner
    source
  }
}

# Owner rejects "" as an invalid email, so unset optional fields are omitted.
# @genqlient(for: "CreateFrameworkInput.description", omitempty: true)
# @genqlient(for: "CreateFrameworkInput.resourceGroupId", omitempty: true)
# @genqlient(for: "CreateFrameworkInput.owner", omitempty: true)
mutation CreateFramework(
  $input: CreateFrameworkInput!
) {
  createFramework(input: $input) {
    id
    name
    description
    resourceGroupId
    owner
  }
}

# @genqlient(for: "UpdateFrameworkInput.resourceGroupId", omitempty: true)
# @genqlient(for: "UpdateFrameworkInput.owner", omitempty: true)
mutation UpdateFramework(
  $input: UpdateFrameworkInput!
) {
  updateFramework(input: $input) {
    id
    name
    description
    resourceGroupId
    owner
  }
}

mutation DeleteFramework($input: DeleteFrameworkInput!) {
  deleteFramework(input: $input) {
    success
  }
}

query GetRequirementById($id: ID!) {
  requirement(id: $id) {
    id
    title
    frameworkIds
    description
    identifier
    priority
    section
  }
}

# identifier, priority and section are optional on the API but reject empty
# strings when present, so an attribute left unset in configuration must be
# omitted from the request rather than sent as "". Without this, omitting
# identifier fails with "Identifier cannot be empty".
# @genqlient(for: "CreateRequirementInput.description", omitempty: true)
# @genqlient(for: "CreateRequirementInput.identifier", omitempty: true)
# @genqlient(for: "CreateRequirementInput.priority", omitempty: true)
# @genqlient(for: "CreateRequirementInput.section", omitempty: true)
mutation CreateRequirement(
  $input: CreateRequirementInput!
) {
  createRequirement(input: $input) {
    id
    title
    description
    identifier
    priority
    section
  }
}

# @genqlient(for: "UpdateRequirementInput.description", omitempty: true)
# @genqlient(for: "UpdateRequirementInput.identifier", omitempty: true)
# @genqlient(for: "UpdateRequirementInput.priority", omitempty: true)
# @genqlient(for: "UpdateRequirementInput.section", omitempty: true)
mutation UpdateRequirement(
  $input: UpdateRequirementInput!
) {
  updateRequirement(input: $input) {
    id
    title
    description
    identifier
    priority
    section
  }
}

mutation DeleteRequirement($input: DeleteRequirementInput!) {
  deleteRequirement(input: $input) {
    success
  }
}
