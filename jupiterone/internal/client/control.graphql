query GetControlById($id: ID!) {
  control(id: $id) {
    id
    name
    description
    resourceGroupId
    state
    identifier
    catalog
    owner
    remediation
    exceptionProcess
    mitreTechnique
    frameworkIds
  }
}

# @genqlient(for: "CreateControlInput.resourceGroupId", omitempty: true)
# @genqlient(for: "CreateControlInput.requirementIds", omitempty: true)
# @genqlient(for: "CreateControlInput.mitreTechnique", omitempty: true)
mutation CreateControl(
  $input: CreateControlInput!
) {
  createControl(input: $input) {
    id
    name
    description
    resourceGroupId
    state
    identifier
    catalog
    owner
    remediation
    exceptionProcess
    mitreTechnique
  }
}

# @genqlient(for: "UpdateControlInput.resourceGroupId", omitempty: true)
# mitreTechnique is a pointer so that an absent value serialises as an explicit
# null, which the API treats as "unset". Sending "" would fail the server-side
# MITRE format validation, and omitting the field entirely would preserve the
# previous value rather than clearing it.
# @genqlient(for: "UpdateControlInput.mitreTechnique", pointer: true)
mutation UpdateControl(
  $input: UpdateControlInput!
) {
  updateControl(input: $input) {
    id
    name
    description
    resourceGroupId
    state
    identifier
    catalog
    owner
    remediation
    exceptionProcess
    mitreTechnique
  }
}

mutation DeleteControl($input: DeleteControlInput!) {
  deleteControl(input: $input) {
    success
  }
}

mutation TransitionControlState($input: TransitionControlStateInput!) {
  transitionControlState(input: $input) {
    id
    state
  }
}
